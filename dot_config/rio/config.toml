theme = "ghostintheshell-scarlet-protocol"
confirm-before-quit = false
padding-x = 10
padding-y = [15, 10]

[editor]
program = "zed"
args = []

[cursor]
shape = 'beam'
blinking = true
blinking-interval = 500

[navigation]
mode = "Tab"
hide-if-single = false

[window]
columns = 140
rows = 60
# width = 1024
# height = 768
opacity = 0.75
blur = true
decorations = "enabled"
windows-corner-preference = "Round"
mode = "Windowed"

[shell]
program = "nu"
args = []

[renderer]
performance = "high"
target-fps = '120'
use-cpu = true
filters = [ "shaders/darken.slangp" ]

[title]
content = "{{ TITLE || PROGRAM }}"

[fonts]
use-drawable-chars = true
family = "FiraCode Nerd Font"
features = ["calt", "liga", "dlig", "ss01", "ss02", "ss03", "ss04", "ss05", "ss06", "ss09"]
hinting = true